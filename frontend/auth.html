<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatWithPDF — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --accent:       #6366f1;
      --accent-hover: #4f46e5;
      --accent-soft:  rgba(99,102,241,0.15);
      --bg:           #0c0c14;
      --bg-card:      rgba(255,255,255,0.04);
      --border:       rgba(255,255,255,0.08);
      --text-1:       #f1f5f9;
      --text-2:       #94a3b8;
      --red:          #ef4444;
      --green:        #22c55e;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Background orbs */
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(80px); pointer-events: none; z-index: 0;
    }
    .orb-1 { width: 400px; height: 400px; background: rgba(99,102,241,0.12); top: -100px; right: -100px; }
    .orb-2 { width: 300px; height: 300px; background: rgba(79,70,229,0.08); bottom: -80px; left: -80px; }

    .auth-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 80px rgba(0,0,0,0.4);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 56px; height: 56px;
      background: var(--accent-soft);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 16px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.4rem; color: var(--accent);
      margin-bottom: 12px;
    }
    .logo h1 { font-size: 1.5rem; font-weight: 700; }
    .logo h1 span { color: var(--accent); }
    .logo p { font-size: 0.82rem; color: var(--text-2); margin-top: 4px; }

    /* Tabs */
    .auth-tabs {
      display: flex;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
    }
    .auth-tab {
      flex: 1; padding: 9px;
      text-align: center; font-size: 0.85rem; font-weight: 500;
      border-radius: 8px; cursor: pointer;
      color: var(--text-2); border: none; background: none;
      transition: all 0.2s;
    }
    .auth-tab.active {
      background: var(--accent);
      color: #fff;
    }

    /* Form */
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 0.78rem; font-weight: 500;
      color: var(--text-2); margin-bottom: 6px;
    }
    .form-group .input-wrap {
      position: relative;
    }
    .form-group .input-wrap i {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--text-2); font-size: 0.85rem;
    }
    .form-group input {
      width: 100%; padding: 11px 12px 11px 36px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-1); font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      outline: none; transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: rgba(99,102,241,0.5); }
    .form-group input::placeholder { color: var(--text-2); }

    .btn-submit {
      width: 100%; padding: 12px;
      background: var(--accent);
      border: none; border-radius: 10px;
      color: #fff; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; margin-top: 8px;
      transition: background 0.2s, transform 0.1s;
      font-family: 'Inter', sans-serif;
    }
    .btn-submit:hover { background: var(--accent-hover); }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg {
      display: none;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px; padding: 10px 14px;
      font-size: 0.82rem; color: #f87171;
      margin-bottom: 16px;
    }
    .error-msg.show { display: block; }

    .success-msg {
      display: none;
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.3);
      border-radius: 8px; padding: 10px 14px;
      font-size: 0.82rem; color: #4ade80;
      margin-bottom: 16px;
    }
    .success-msg.show { display: block; }

    .divider {
      text-align: center; font-size: 0.75rem; color: var(--text-2);
      margin: 20px 0; position: relative;
    }
    .divider::before, .divider::after {
      content: ''; position: absolute; top: 50%;
      width: 40%; height: 1px; background: var(--border);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
  </style>
</head>
<body style="visibility:hidden">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-card">
    <div class="logo">
      <div class="logo-icon"><i class="fa-solid fa-file-pdf"></i></div>
      <h1>ChatWith<span>PDF</span></h1>
      <p>AI-Powered Document Assistant</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="showTab('login')">Login</button>
      <button class="auth-tab" id="tabRegister" onclick="showTab('register')">Register</button>
    </div>

    <!-- Error / Success -->
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <div class="input-wrap">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="loginEmail" placeholder="you@example.com" required/>
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="loginPassword" placeholder="••••••••" required/>
        </div>
      </div>
      <button class="btn-submit" type="submit" id="loginBtn">
        <i class="fa-solid fa-right-to-bracket"></i> Login
      </button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrap">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="regUsername" placeholder="yourname" required/>
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <div class="input-wrap">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="regEmail" placeholder="you@example.com" required/>
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="regPassword" placeholder="Min 6 characters" required/>
        </div>
      </div>
      <button class="btn-submit" type="submit" id="registerBtn">
        <i class="fa-solid fa-user-plus"></i> Create Account
      </button>
    </form>
  </div>

  <script>
    const API_BASE = 'https://chatwithpdf-production.up.railway.app';

    // Redirect if already logged in, else show page
    if (localStorage.getItem('token')) {
      window.location.href = 'pdf.html';
    } else {
      document.body.style.visibility = 'visible';
    }

    function showTab(tab) {
      document.getElementById('loginForm').style.display    = tab === 'login'    ? '' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? '' : 'none';
      document.getElementById('tabLogin').classList.toggle('active',    tab === 'login');
      document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
      hideMessages();
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg; el.classList.add('show');
      document.getElementById('successMsg').classList.remove('show');
    }

    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = msg; el.classList.add('show');
      document.getElementById('errorMsg').classList.remove('show');
    }

    function hideMessages() {
      document.getElementById('errorMsg').classList.remove('show');
      document.getElementById('successMsg').classList.remove('show');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = 'Logging in...';

      try {
        const res  = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email:    document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Login failed');

        localStorage.setItem('token',    data.access_token);
        localStorage.setItem('username', data.user.username);
        localStorage.setItem('user_id',  data.user.id);

        showSuccess('Login successful! Redirecting...');
        setTimeout(() => window.location.href = 'pdf.html', 800);
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      btn.disabled = true; btn.textContent = 'Creating account...';

      try {
        const res  = await fetch(`${API_BASE}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('regUsername').value,
            email:    document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Registration failed');

        localStorage.setItem('token',    data.access_token);
        localStorage.setItem('username', data.user.username);
        localStorage.setItem('user_id',  data.user.id);

        showSuccess('Account created! Redirecting...');
        setTimeout(() => window.location.href = 'pdf.html', 800);
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
      }
    }
  </script>
</body>
</html>
